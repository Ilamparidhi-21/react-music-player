version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 16.20.2
        - nvm use 16.20.2
        - node -v
        - yarn install
    build:
      commands:
        - node -v
        - yarn run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
